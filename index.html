<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Ofertas Shopee</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
    textarea { width: 100%; height: 120px; border-radius: 8px; padding: 10px; border: 1px solid #ccc; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #ee4d2d; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    .status { margin-top: 10px; text-align: center; color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h2>🛒 Gerador de Ofertas Shopee</h2>
  <label for="links">Cole os links da Shopee abaixo:</label>
  <textarea id="links" placeholder="Cole um ou vários links aqui..."></textarea>

  <button onclick="enviarParaN8N()">🚀 Postar no Canal</button>
  <div id="mensagem" class="status"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    async function enviarParaN8N() {
      const textoLinks = document.getElementById('links').value;
      const statusDiv = document.getElementById('mensagem');

      if (!textoLinks) {
        alert('Por favor, cole pelo menos um link!');
        return;
      }

      statusDiv.innerText = "Processando no n8n...";

      const WEBHOOK_URL = 'SUA_URL_DO_N8N_WEBHOOK_AQUI';

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            links: textoLinks,
            usuario: tg.initDataUnsafe?.user?.first_name || "Admin" 
          })
        });

        if (response.ok) {
          statusDiv.innerText = "✅ Ofertas enviadas para processamento!";
          document.getElementById('links').value = '';
        } else {
          statusDiv.innerText = "❌ Erro ao enviar para o n8n.";
        }
      } catch (err) {
        statusDiv.innerText = "❌ Erro de conexão com o n8n.";
      }
    }
  </script>
</body>
</html>
